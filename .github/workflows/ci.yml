name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    permissions:
      contents: read
      actions: write
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYTHONOS_QEMU_ACCEL: tcg
      PYTHONOS_GUI_BOOT_TIMEOUT: "90"
      PYTHONOS_AUDIO_BOOT_TIMEOUT: "90"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64
            runner: ubuntu-24.04
            qemu_pkg: qemu-system-x86
            qemu_bin: qemu-system-x86_64
            artifact: pythonos-x86_64
            artifact_path: build/pythonos.iso
          - name: arm64
            runner: ubuntu-24.04-arm
            qemu_pkg: qemu-system-arm
            qemu_bin: qemu-system-aarch64
            artifact: pythonos-arm64
            artifact_path: build-arm64/pythonos-arm64.elf

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            make \
            python3 \
            pkg-config \
            ${{ matrix.qemu_pkg }} \
            qemu-utils \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev

      - name: Show platform
        run: |
          uname -a
          docker --version
          ${{ matrix.qemu_bin }} --version

      # Exercise the documented first-install entry point before the broader
      # release gate.  validate-release.sh uses explicit build-gui targets, so
      # it cannot by itself catch regressions in bare `make` dispatch.
      - name: Test documented installation
        run: make

      - name: Validate release gate
        run: ./scripts/validate-release.sh

      - name: Upload bootable image
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 14

  # One named check that is red unless every matrix cell passed. Branch
  # protection and `gh run watch --exit-status` can key off this.
  ci-ok:
    name: all-arches
    needs: validate
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Require every architecture job
        run: |
          if [ "${{ needs.validate.result }}" != "success" ]; then
            echo "architecture matrix failed: ${{ needs.validate.result }}"
            exit 1
          fi
