name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    permissions:
      contents: read
      actions: write
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYTHONOS_QEMU_ACCEL: tcg
      PYTHONOS_GUI_BOOT_TIMEOUT: "90"
      PYTHONOS_AUDIO_BOOT_TIMEOUT: "90"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64
            runner: ubuntu-24.04
            qemu_pkg: qemu-system-x86
            qemu_bin: qemu-system-x86_64
            artifact: pythonos-x86_64
            artifact_path: build/pythonos.iso
          - name: arm64
            runner: ubuntu-24.04-arm
            qemu_pkg: qemu-system-arm
            qemu_bin: qemu-system-aarch64
            artifact: pythonos-arm64
            artifact_path: build-arm64/pythonos-arm64.elf
          # Intel supports the Linux VM needed by our Docker build. Do not
          # replace with macos-latest (Apple Silicon) without validating Docker.
          - name: macos-x86_64
            runner: macos-15-intel
            qemu_bin: qemu-system-x86_64
            artifact: pythonos-macos-x86_64
            artifact_path: build/pythonos.iso

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install host dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            make \
            python3 \
            pkg-config \
            ${{ matrix.qemu_pkg }} \
            qemu-utils \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev

      - name: Install macOS dependencies and start Docker
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          brew install make python qemu pkg-config sdl2 sdl2_image sdl2_mixer sdl2_ttf colima docker docker-buildx
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
          mkdir -p "$HOME/.docker/cli-plugins"
          ln -s "$(brew --prefix docker-buildx)/bin/docker-buildx" "$HOME/.docker/cli-plugins/docker-buildx"
          colima start --runtime docker --cpu 3 --memory 6 --disk 40
          docker info

      - name: Show platform
        run: |
          uname -a
          docker --version
          ${{ matrix.qemu_bin }} --version

      # Exercise the documented first-install entry point before the broader
      # release gate.  validate-release.sh uses explicit build-gui targets, so
      # it cannot by itself catch regressions in bare `make` dispatch.
      - name: Test documented installation
        run: make

      - name: Validate release gate
        run: ./scripts/validate-release.sh

      - name: Upload bootable image
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Stop macOS Docker VM
        if: always() && runner.os == 'macOS'
        run: colima stop

  # One named check that is red unless every matrix cell passed. Branch
  # protection and `gh run watch --exit-status` can key off this.
  ci-ok:
    name: all-arches
    needs: validate
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Require every host and architecture job
        run: |
          if [ "${{ needs.validate.result }}" != "success" ]; then
            echo "architecture matrix failed: ${{ needs.validate.result }}"
            exit 1
          fi
