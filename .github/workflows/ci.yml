name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    name: Validate Sources
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            make \
            python3 \
            qemu-system-arm \
            qemu-utils \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev

      - name: Show platform
        run: |
          uname -a
          docker --version
          qemu-system-aarch64 --version

      - name: Validate release gate
        run: ./scripts/validate-release.sh
